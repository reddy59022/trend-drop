services:
  - type: web
    name: trend-drop
    env: node
    # Stable LTS Node version compatible with react-scripts (v5.x)
    nodeVersion: 20
    # Install client dependencies with a clean install (npm ci), build the React
    # app, then install server dependencies.
    buildCommand: cd client && npm ci && npm run build && cd ../server && npm ci
    # Express serves the API and the built client statically (NODE_ENV set via envVars below).
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      # SECURITY: No secret values are committed in this file.
      # All secret env vars use `sync: false`, so their values are prompted for /
      # managed exclusively in the Render dashboard (never stored in source control).
      #
      # IMPORTANT: The following credentials were previously committed to this repo
      # and MUST be rotated before the next production deploy:
      #   - MongoDB Atlas user password (MONGO_URI)
      #   - JWT_SECRET
      #   - CLOUDINARY_API_SECRET
      - key: FRONTEND_URL
        # Frontend URL used for email links (verification, password reset, etc.)
        value: "https://trend-drop.onrender.com"
        sync: false
      - key: CLIENT_URL
        value: "https://trend-drop.onrender.com"
      - key: CLOUDINARY_CLOUD_NAME
        value: dhw3unh0e
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Cloudinary API key is a public identifier; the secret stays out of source.
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Stripe configuration – set real keys in the Render dashboard.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Email (Brevo)
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      # OAuth providers
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: FB_APP_ID
        sync: false
      - key: FB_APP_SECRET
        sync: false
