services:
  - type: web
    name: trend-drop
    env: node
    # Stable LTS Node version compatible with react-scripts (v5.x)
    nodeVersion: 20
    # Install client dependencies, build the React app, then install server dependencies.
    buildCommand: cd client && npm ci && npm run build && cd ../server && npm ci
    # Express serves the API and the built client statically (NODE_ENV set via envVars below).
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: "https://trend-drop.onrender.com"
        sync: false
      - key: CLIENT_URL
        value: "https://trend-drop.onrender.com"
      - key: CLOUDINARY_CLOUD_NAME
        value: dhw3unh0e
      # --- Secrets: PLACEHOLDERS ONLY. Set real values in the Render dashboard. ---
      - key: MONGO_URI
        value: "mongodb+srv://USERNAME:PASSWORD@cluster0.example.mongodb.net/trend-drop?retryWrites=true&w=majority"
        sync: false
      - key: JWT_SECRET
        value: CHANGE_ME_random_64_chars
        sync: false
      - key: CLOUDINARY_API_KEY
        value: CHANGE_ME
        sync: false
      - key: CLOUDINARY_API_SECRET
        value: CHANGE_ME
        sync: false
      - key: STRIPE_SECRET_KEY
        value: CHANGE_ME
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        value: CHANGE_ME
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        value: CHANGE_ME
        sync: false
      - key: BREVO_API_KEY
        value: CHANGE_ME
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: CHANGE_ME
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: CHANGE_ME
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        value: CHANGE_ME
        sync: false
      - key: ADMIN_EMAILS
        value: CHANGE_ME
        sync: false
      - key: APPLE_CLIENT_ID
        value: CHANGE_ME
        sync: false
      - key: FB_APP_ID
        value: CHANGE_ME
        sync: false
      - key: FB_APP_SECRET
        value: CHANGE_ME
        sync: false
