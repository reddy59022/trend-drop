services:
  - type: web
    name: trend-drop
    env: node
    # Stable LTS Node version compatible with react-scripts (v5.x)
    nodeVersion: 20
    # Install client dependencies with a clean install (npm ci), build the React
    # app, then install server dependencies.
    buildCommand: cd client && npm ci && npm run build && cd ../server && npm ci
    # Express serves the API and the built client statically (NODE_ENV set via envVars below).
    # Temporary until production policy packs are published; keeps launch-market
    # traffic available even when the existing Render service does not sync the
    # LEGAL_ENFORCEMENT env-var entry from this Blueprint.
    startCommand: LEGAL_ENFORCEMENT=false node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      # SECURITY: No secret values are committed in this file.
      # All secret env vars use `sync: false`, so their values are prompted for /
      # managed exclusively in the Render dashboard (never stored in source control).
      #
      # IMPORTANT: The following credentials were previously committed to this repo
      # and MUST be rotated before the next production deploy:
      #   - MongoDB Atlas user password (MONGO_URI)
      #   - JWT_SECRET
      #   - CLOUDINARY_API_SECRET
      - key: FRONTEND_URL
        # Frontend URL used for email links (verification, password reset, etc.)
        value: "https://trend-drop.onrender.com"
        sync: false
      - key: CLIENT_URL
        value: "https://trend-drop.onrender.com"
      - key: CLOUDINARY_CLOUD_NAME
        value: dhw3unh0e
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Cloudinary API key is a public identifier; the secret stays out of source.
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Stripe configuration – set real keys in the Render dashboard.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Platform-owned shipping. Orders fail closed until this key is present.
      # Keep this deployment on the existing production EasyPost account.
      # Dashboard-managed so a test deploy can switch to sandbox without the
      # Blueprint overwriting it; unset defaults to production in code.
      - key: EASYPOST_MODE
        sync: false
      - key: EASYPOST_API_KEY
        sync: false
      # Only used when EASYPOST_MODE=sandbox/test, so a production deploy can
      # exercise test labels without replacing its live key.
      - key: EASYPOST_TEST_API_KEY
        sync: false
      # Must exactly match the `webhook_secret` on the EasyPost Test webhook.
      # Dashboard-managed; absent means the webhook fails closed.
      - key: EASYPOST_WEBHOOK_SECRET
        sync: false
      # Signed carrier tracking webhook (never use the development default in production).
      - key: TRACKING_WEBHOOK_SECRET
        sync: false
      # Email (Brevo)
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      # OAuth providers
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # Distinct state key per environment; prevents staging alerts from
      # suppressing production alerts when both use one MongoDB cluster.
      - key: ORPHAN_ALERT_STATE_KEY
        value: "trend-drop-production"
      - key: ORPHAN_ALERT_CRITICAL_THRESHOLD
        value: "10"
      # Secondary paging path (Slack incoming webhook or on-call automation).
      # Optional but recommended: email failures must not silence integrity alerts.
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: FB_APP_ID
        sync: false
      - key: FB_APP_SECRET
        sync: false
      # Legal entity config — required by the production startup gate in
      # server/config/legal.js (assertProductionLegalConfig). Startup fails
      # with LEGAL_CONFIG_INCOMPLETE unless all four are set (no empty values,
      # no '[' placeholders, contact must not end in .invalid).
      # TEMPORARY working values so deploys succeed — replace with the real
      # registered entity details (dashboard overrides take precedence).
      - key: LEGAL_ENTITY_NAME
        value: "TrendDrop, Inc."
      - key: LEGAL_ENTITY_ADDRESS
        value: "123 Market Street, San Francisco, CA 94105, USA"
      - key: LEGAL_ENTITY_JURISDICTION
        value: "Delaware, USA"
      - key: LEGAL_CONTACT_EMAIL
        value: "connect.trenddrop@gmail.com"
      # Public support address shown in the footer, legal center, blocked-region
      # page, and transactional email replies.
      - key: CONTACT_EMAIL
        value: "connect.trenddrop@gmail.com"
      # Temporary availability bridge: the production database currently has
      # no published JurisdictionPolicyPack records, so the fail-closed legal
      # gate would return 403 for every launch-market request. This still
      # enforces the centralized code-level market list; remove it after real
      # counsel-reviewed packs are published in the production database.
      - key: LEGAL_ENFORCEMENT
        value: "false"
