apply plugin: 'com.android.application'

// TD-2.1 — Key-gated release signing.
// Signing activates when a keystore is available via env vars or Gradle
// properties (local builds or CI secrets). Without a keystore, `assembleRelease`
// produces an unsigned APK (app-release-unsigned.apk) so the pipeline is never
// blocked on credentials. Keystore material is NEVER committed to the repo.
// NOTE: local vars are prefixed (ks*/cfg*) to avoid shadowing the Gradle DSL
// setters storeFile/storePassword/keyAlias/keyPassword.
def envOr = { String name, String fallback ->
    def v = System.getenv(name)
    if (v != null && !v.isEmpty()) return v
    return project.hasProperty(name) ? project.getProperty(name) : fallback
}

def ksPath = envOr('TRENDDROP_KEYSTORE_PATH', null)
def ksBase64 = envOr('TRENDDROP_KEYSTORE_BASE64', null)
def ksStorePass = envOr('TRENDDROP_KEYSTORE_PASSWORD', null)
def ksAlias = envOr('TRENDDROP_KEY_ALIAS', null)
def ksKeyPass = envOr('TRENDDROP_KEY_PASSWORD', null)
def signingReady = (ksPath != null || ksBase64 != null) &&
        ksStorePass != null && ksAlias != null && ksKeyPass != null

android {
    namespace "com.trenddrop.app"
    compileSdk rootProject.ext.compileSdkVersion

    signingConfigs {
        release {
            if (ksBase64 != null) {
                // CI secrets path: decode the base64-encoded keystore into the
                // module build dir (gitignored) at configuration time.
                def ks = file("${buildDir}/trenddrop-release.keystore")
                ks.parentFile.mkdirs()
                ks.bytes = Base64.getDecoder().decode(ksBase64)
                storeFile ks
            } else if (ksPath != null) {
                // Local path: e.g. TRENDDROP_KEYSTORE_PATH=/secure/trenddrop-release.keystore
                storeFile file(ksPath)
            }
            storePassword ksStorePass
            keyAlias ksAlias
            keyPassword ksKeyPass
        }
    }

    defaultConfig {
        applicationId "com.trenddrop.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (envOr('TRENDDROP_VERSION_CODE', '1') as Integer)
        versionName envOr('TRENDDROP_VERSION_NAME', '1.0')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
