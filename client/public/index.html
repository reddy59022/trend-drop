<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="description" content="TrendDrop — the social marketplace for fashion. Shop trends, list your closet in seconds and trade offers instantly." />

  <!-- Install/home-screen metadata (web-app + iOS standards) -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TrendDrop" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Icons: SVG favicon for modern browsers, PNG fallbacks, iOS touch icon -->
  <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/img/icons/favicon-48.png" sizes="48x48" type="image/png" />
  <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon-180.png" />

  <!-- Social share cards (OG/Twitter) so link previews carry the brand -->
  <meta property="og:site_name" content="TrendDrop" />
  <meta property="og:title" content="TrendDrop — Buy & Sell Fashion" />
  <meta property="og:description" content="The social marketplace for fashion. Shop trends, list your closet in seconds and trade offers instantly." />
  <meta property="og:image" content="/img/icons/icon-512.png" />
  <meta name="twitter:card" content="summary" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <title>TrendDrop</title>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
