<?xml version="1.0" encoding="UTF-8"?>
<!-- TrendDrop unified app icon: gradient background with initials -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90E2"/>
      <stop offset="100%" stop-color="#9013FE"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#grad)" rx="64"/>
  <!-- Simplified icon shape to avoid font rendering issues -->
  <circle cx="256" cy="256" r="120" fill="#FFF" />
</svg>